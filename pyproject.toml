[project]
name = "aoun-os"
version = "0.1.0"
description = "An evidence-grounded personal portfolio assistant"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "google-genai>=1.0,<3", "groq>=0.20,<2", "chromadb>=1.0,<2",
  "python-dotenv>=1.0,<2", "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.setuptools.packages.find]
include = ["backend*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
